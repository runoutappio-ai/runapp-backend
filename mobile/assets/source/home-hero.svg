<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A0D1A"/>
      <stop offset="0.28" stop-color="#5E1B31"/>
      <stop offset="0.48" stop-color="#A2393F"/>
      <stop offset="0.62" stop-color="#DB7446"/>
      <stop offset="0.72" stop-color="#F4B063"/>
      <stop offset="1" stop-color="#F7C987"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF1CF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FFD48C" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFB060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4D6" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#FFD58A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFB060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B0E18"/>
      <stop offset="1" stop-color="#16070C"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1522"/>
      <stop offset="1" stop-color="#12060A"/>
    </linearGradient>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="1000" fill="url(#sky)"/>
  <!-- sun low behind the group -->
  <circle cx="640" cy="560" r="260" fill="url(#sunGlow)"/>
  <circle cx="640" cy="560" r="70" fill="#FFF0CC" opacity="0.95"/>

  <!-- far skyline (generic towers) -->
  <g fill="#B4524E" opacity="0.55">
    <rect x="30" y="470" width="60" height="140"/>
    <rect x="100" y="430" width="44" height="180"/>
    <rect x="152" y="500" width="70" height="110"/>
    <rect x="240" y="450" width="38" height="160"/>
    <rect x="860" y="460" width="50" height="150"/>
    <rect x="920" y="420" width="36" height="190"/>
    <rect x="968" y="490" width="80" height="120"/>
    <rect x="1060" y="440" width="46" height="170"/>
    <rect x="1115" y="480" width="70" height="130"/>
  </g>
  <!-- near skyline -->
  <g fill="#7A2A3C" opacity="0.85">
    <rect x="0" y="520" width="80" height="120"/>
    <path d="M300 640 L300 360 L318 330 L336 360 L336 640 Z"/>
    <rect x="345" y="470" width="58" height="170"/>
    <rect x="780" y="500" width="64" height="140"/>
    <!-- slender spire tower -->
    <path d="M1000 640 L1000 300 L1012 300 L1016 180 L1020 90 L1024 180 L1028 300 L1040 300 L1040 640 Z"/>
    <rect x="1050" y="500" width="70" height="140"/>
    <rect x="1130" y="460" width="70" height="180"/>
  </g>
  <!-- haze over the horizon -->
  <rect x="0" y="560" width="1200" height="120" fill="#F7C987" opacity="0.25" filter="url(#blur20)"/>

  <!-- terrace railing -->
  <rect x="0" y="628" width="1200" height="8" rx="4" fill="#2A0F18"/>
  <g fill="#2A0F18">
    <rect x="40" y="636" width="6" height="120"/><rect x="200" y="636" width="6" height="120"/>
    <rect x="360" y="636" width="6" height="120"/><rect x="840" y="636" width="6" height="120"/>
    <rect x="1000" y="636" width="6" height="120"/><rect x="1160" y="636" width="6" height="120"/>
  </g>
  <rect x="0" y="690" width="1200" height="4" fill="#2A0F18" opacity="0.8"/>

  <!-- string lights -->
  <g fill="none" stroke="#1E0A12" stroke-width="2.5" opacity="0.9">
    <path d="M-20 80 Q 300 230 620 110 Q 900 10 1220 150"/>
    <path d="M-20 250 Q 260 360 600 270 Q 930 190 1220 300"/>
  </g>
  <g filter="url(#blur8)" fill="#FFD58A" opacity="0.8">
    <circle cx="60" cy="118" r="18"/><circle cx="170" cy="163" r="18"/><circle cx="290" cy="183" r="18"/><circle cx="410" cy="170" r="18"/>
    <circle cx="530" cy="133" r="18"/><circle cx="650" cy="98" r="18"/><circle cx="770" cy="76" r="18"/><circle cx="890" cy="80" r="18"/>
    <circle cx="1010" cy="104" r="18"/><circle cx="1130" cy="135" r="18"/>
    <circle cx="80" cy="287" r="16"/><circle cx="210" cy="316" r="16"/><circle cx="350" cy="322" r="16"/><circle cx="490" cy="298" r="16"/>
    <circle cx="630" cy="265" r="16"/><circle cx="770" cy="238" r="16"/><circle cx="910" cy="236" r="16"/><circle cx="1050" cy="257" r="16"/><circle cx="1180" cy="290" r="16"/>
  </g>
  <g fill="#FFF3D2">
    <circle cx="60" cy="118" r="6"/><circle cx="170" cy="163" r="6"/><circle cx="290" cy="183" r="6"/><circle cx="410" cy="170" r="6"/>
    <circle cx="530" cy="133" r="6"/><circle cx="650" cy="98" r="6"/><circle cx="770" cy="76" r="6"/><circle cx="890" cy="80" r="6"/>
    <circle cx="1010" cy="104" r="6"/><circle cx="1130" cy="135" r="6"/>
    <circle cx="80" cy="287" r="5"/><circle cx="210" cy="316" r="5"/><circle cx="350" cy="322" r="5"/><circle cx="490" cy="298" r="5"/>
    <circle cx="630" cy="265" r="5"/><circle cx="770" cy="238" r="5"/><circle cx="910" cy="236" r="5"/><circle cx="1050" cy="257" r="5"/><circle cx="1180" cy="290" r="5"/>
  </g>
  <!-- soft bokeh -->
  <g filter="url(#blur20)">
    <circle cx="140" cy="60" r="50" fill="#FFD58A" opacity="0.25"/>
    <circle cx="1080" cy="40" r="60" fill="#FFC27A" opacity="0.2"/>
    <circle cx="880" cy="200" r="40" fill="#FFE2A8" opacity="0.18"/>
  </g>

  <!-- the group, backlit (rim light in amber) -->
  <g>
    <!-- person 1: left, leaning in, laughing -->
    <g transform="translate(250 0)">
      <path d="M-120 1000 L-120 700 Q-118 610 -40 585 L 40 585 Q 118 610 120 700 L120 1000 Z" fill="url(#figure)"/>
      <path d="M-40 585 Q 0 600 40 585 L 30 560 L -30 560 Z" fill="url(#figure)"/>
      <ellipse cx="6" cy="505" rx="54" ry="62" fill="url(#figure)" transform="rotate(-10 6 505)"/>
      <path d="M-44 470 Q 0 425 50 462" fill="none" stroke="#F4B063" stroke-width="3" opacity="0.7" filter="url(#blur3)"/>
      <path d="M-118 700 Q -116 612 -42 587" fill="none" stroke="#F4B063" stroke-width="3" opacity="0.5" filter="url(#blur3)"/>
    </g>
    <!-- person 2: hand raised mid-laugh -->
    <g transform="translate(470 -20)">
      <path d="M-110 1020 L-110 700 Q-106 620 -36 600 L 36 600 Q 106 620 110 700 L110 1020 Z" fill="url(#figure)"/>
      <path d="M78 650 L 150 590 L 150 505" fill="none" stroke="#240C14" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="152" cy="480" rx="24" ry="28" fill="#240C14"/>
      <ellipse cx="0" cy="522" rx="50" ry="60" fill="url(#figure)"/>
      <path d="M-40 486 Q 0 450 44 480" fill="none" stroke="#F4B063" stroke-width="3" opacity="0.7" filter="url(#blur3)"/>
      <path d="M132 460 Q 152 446 174 466" fill="none" stroke="#FFD58A" stroke-width="3" opacity="0.8" filter="url(#blur3)"/>
    </g>
    <!-- person 3: headscarf silhouette -->
    <g transform="translate(760 -10)">
      <path d="M-116 1010 L-116 700 Q-112 612 -40 592 L 40 592 Q 112 612 116 700 L116 1010 Z" fill="url(#figure)"/>
      <path d="M-62 520 Q -64 440 0 438 Q 64 440 62 520 Q 66 590 30 612 L -30 612 Q -66 590 -62 520 Z" fill="url(#figure)"/>
      <path d="M-56 480 Q 0 420 56 480" fill="none" stroke="#F4B063" stroke-width="3" opacity="0.7" filter="url(#blur3)"/>
      <path d="M112 700 Q 110 614 42 594" fill="none" stroke="#F4B063" stroke-width="3" opacity="0.5" filter="url(#blur3)"/>
    </g>
    <!-- person 4: right, turned toward the group -->
    <g transform="translate(990 10)">
      <path d="M-120 990 L-120 700 Q-116 610 -42 588 L 42 588 Q 116 610 120 700 L120 990 Z" fill="url(#figure)"/>
      <ellipse cx="-6" cy="508" rx="52" ry="60" fill="url(#figure)" transform="rotate(8 -6 508)"/>
      <path d="M-50 474 Q -4 434 44 466" fill="none" stroke="#F4B063" stroke-width="3" opacity="0.7" filter="url(#blur3)"/>
    </g>
  </g>

  <!-- table with shared dishes and a lantern -->
  <path d="M60 1000 L120 800 Q 600 760 1080 800 L1140 1000 Z" fill="url(#table)"/>
  <ellipse cx="600" cy="802" rx="480" ry="34" fill="#4A1A2A"/>
  <g fill="#F3E9D2" opacity="0.9">
    <ellipse cx="380" cy="800" rx="70" ry="14"/>
    <ellipse cx="820" cy="800" rx="70" ry="14"/>
    <ellipse cx="600" cy="812" rx="84" ry="16"/>
  </g>
  <g fill="#C8763E" opacity="0.9">
    <ellipse cx="380" cy="796" rx="40" ry="8"/>
    <ellipse cx="820" cy="796" rx="40" ry="8"/>
    <ellipse cx="600" cy="807" rx="52" ry="10"/>
  </g>
  <circle cx="600" cy="760" r="120" fill="url(#lantern)" opacity="0.9"/>
  <rect x="582" y="728" width="36" height="52" rx="8" fill="#FFE8B8" opacity="0.95"/>
  <rect x="588" y="716" width="24" height="14" rx="4" fill="#3A1522"/>
  <!-- glasses of water / mocktail tumblers (no stems, no wine) -->
  <g fill="#FFF3DF" opacity="0.55">
    <rect x="470" y="770" width="18" height="30" rx="4"/>
    <rect x="712" y="770" width="18" height="30" rx="4"/>
  </g>

  <!-- gentle vignette -->
  <rect width="1200" height="1000" fill="none" stroke="#12060A" stroke-width="120" opacity="0.35" filter="url(#blur20)"/>
</svg>
